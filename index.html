<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1a1a1a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Celengan">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Celengan</title>
<style>
:root{--bg:#1a1a1a;--c:#222;--c2:#2f2f2f;--g:#0bc78d;--gd:#06935f;--y:#f5b301;--t:#f2f2f2;--m:#8d8d8d;--r:#ef5b5b;--l:#333;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--t);font:15px/1.4 system-ui,-apple-system,sans-serif;padding-bottom:calc(90px + env(safe-area-inset-bottom));overscroll-behavior-y:none}
button,select,input{touch-action:manipulation}
.w{max-width:520px;margin:auto;padding:16px;padding-top:calc(16px + env(safe-area-inset-top))}
h1{font-size:24px;margin:4px 0 14px}h3{margin:18px 0 10px}
.mt{color:var(--m)}.in{color:var(--g)}.out{color:var(--r)}.warn{color:var(--y)}
.rw{display:flex;justify-content:space-between;align-items:center;gap:10px}
.chips{display:flex;gap:10px;overflow-x:auto;margin:0 -16px 14px;padding:0 16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;background:var(--c2);color:var(--m);border-radius:99px;padding:10px 20px;border:0;font:inherit;min-height:44px}
.chip.on{background:var(--g);color:#fff;font-weight:700}
.hero{background:linear-gradient(135deg,var(--gd),#05a96d);border-radius:28px;padding:20px;margin-bottom:14px}
.hero small{opacity:.85}.big{font-size:30px;font-weight:800;margin:4px 0 16px;display:flex;justify-content:space-between;align-items:center}
.eye{background:#ffffff26;border:0;border-radius:12px;padding:6px 10px;font-size:16px;min-height:36px}
.pp{display:flex;gap:10px}.pp div{flex:1;background:#ffffff26;border-radius:18px;padding:12px}.pp b{display:block;font-size:17px}
.card{background:var(--c);border-radius:24px;padding:14px 16px;margin-bottom:14px;border:1px solid var(--l)}
.empty{text-align:center;padding:36px 16px}
.day{color:var(--m);font-size:13px;margin:16px 0 2px}
.it{display:flex;align-items:center;gap:12px;padding:10px 0}
.it .g{flex:1;min-width:0}.it small{color:var(--m);display:block}
.it small.in{color:var(--g)}.it small.out{color:var(--r)}.it small.warn{color:var(--y)}
.ic{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:20px;flex:none;object-fit:cover;font-weight:700}
.pie{width:180px;height:180px;border-radius:50%;margin:16px auto;position:relative}
.pie:after{content:"";position:absolute;inset:36px;background:var(--c);border-radius:50%}
.dot{width:12px;height:12px;border-radius:4px;flex:none}
.bars{display:flex;gap:8px;height:120px;margin-top:12px}
.bars div{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.bars i{width:100%;background:var(--r);border-radius:8px 8px 3px 3px;min-height:3px}.bars small{color:var(--m);font-size:11px;margin-top:4px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--c);display:flex;gap:4px;padding:8px 8px calc(8px + env(safe-area-inset-bottom));border-top:1px solid var(--l);z-index:5}
nav button{flex:1;background:none;border:0;color:var(--m);padding:8px 0;font:inherit;font-size:12px;border-radius:18px;min-height:50px}
nav span{display:block;font-size:20px}nav .on{background:var(--c2);color:var(--g);font-weight:700}
.fab{position:fixed;right:18px;bottom:calc(92px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:20px;border:0;background:var(--g);color:#fff;font-size:34px;box-shadow:0 6px 18px #0bc78d55;z-index:4}
.md{position:fixed;inset:0;background:var(--bg);z-index:9;overflow:auto;overscroll-behavior:contain;transform:translateY(100%);visibility:hidden;transition:transform .38s cubic-bezier(.32,.72,0,1),visibility 0s linear .38s}.md.o{transform:none;visibility:visible;transition:transform .38s cubic-bezier(.32,.72,0,1),visibility 0s}
#mb{max-width:520px;margin:auto;padding-bottom:calc(30px + env(safe-area-inset-bottom))}
.mh{background:#079a73;padding:calc(14px + env(safe-area-inset-top)) 16px 18px;color:#fff}
.mh .tt{font-size:18px;font-weight:700}.mh .x{color:#fff;font-size:22px}
.seg{display:flex;background:#00000026;border-radius:99px;margin:12px 0}
.seg button{flex:1;border:0;background:none;color:#ffffffcc;padding:10px 4px;border-radius:99px;font:inherit;font-size:14px;min-height:44px}.seg .on{background:var(--g);color:#fff;font-weight:700}
.amt{width:100%;background:none;border:0;color:#fff;font-size:40px;font-weight:700;outline:0;padding:0}.amt::placeholder{color:#ffffff80}
.fr{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--l);min-height:52px}.fr>span{color:var(--m)}
.fr select,.fr input{background:none;border:0;color:var(--t);font:inherit;font-size:16px;text-align:right;max-width:68%;outline:0}
.fr select option{background:var(--c);color:var(--t)}
.lb{color:var(--m);margin:16px 0 8px}
.cg{display:flex;flex-wrap:wrap;gap:8px}
.ch{background:var(--c2);color:var(--t);border:1.5px solid transparent;border-radius:14px;padding:9px 12px;font:inherit;min-height:44px}.ch.on{border-color:var(--g);color:var(--g)}
.sv{width:100%;margin-top:24px;background:var(--g);color:#fff;border:0;border-radius:16px;padding:15px;font:inherit;font-weight:700;min-height:50px}
.sv:disabled{opacity:.6}
.x{background:none;border:0;color:var(--r);font:inherit;padding:6px;min-height:36px}
.stk{display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--c2);margin:10px 0}.stk i{display:block;height:100%}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--g);outline-offset:2px}
/* switch */
.sw{position:relative;width:48px;height:28px;flex:none;display:inline-block}
.sw input{position:absolute;inset:-8px;opacity:0;width:calc(100% + 16px);height:calc(100% + 16px);margin:0;z-index:1;cursor:pointer;max-width:none}
.sw i{position:absolute;inset:0;background:#4a4a4a;border-radius:99px;transition:.2s}
.sw i:after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.sw input:checked+i{background:var(--g)}.sw input:checked+i:after{transform:translateX(20px)}
/* lock screen */
.lk{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;align-items:center;justify-content:center;padding:calc(20px + env(safe-area-inset-top)) 20px calc(20px + env(safe-area-inset-bottom));overflow:auto}
.lkb{width:100%;max-width:320px;text-align:center}
.lkb h1{margin:8px 0 4px}.lkb .lg{font-size:48px}
.dots{display:flex;gap:14px;justify-content:center;margin:18px 0 8px;height:16px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--m)}.dots i.f{background:var(--g);border-color:var(--g)}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px}
.kp button{height:66px;border-radius:22px;border:0;background:var(--c2);color:var(--t);font:inherit;font-size:26px;font-weight:600}
.kp button:active{background:var(--gd)}.kp .ok{background:var(--g);color:#fff}
/* ---- animasi ala iOS ---- */
:root{--ease:cubic-bezier(.32,.72,0,1);--spring:cubic-bezier(.34,1.56,.64,1)}
button,.chip,.ch,.sv,.x{transition:transform .2s var(--ease),opacity .2s,background-color .25s,color .25s,border-color .25s}
button:active{transform:scale(.95);opacity:.8}
.sv:active{transform:scale(.98)}
.fab{transition:transform .35s var(--spring),opacity .25s}
.fab:active{transform:scale(.88);opacity:1}
.fab.h{transform:scale(.3);opacity:0;pointer-events:none}
.it[onclick]{transition:opacity .15s}.it[onclick]:active{opacity:.5}
.card[onclick]{transition:transform .2s var(--ease),background-color .2s}.card[onclick]:active{transform:scale(.985);background:#2a2a2a}
nav button span{transition:transform .35s var(--spring)}
nav .on span{transform:translateY(-2px) scale(1.18)}
nav:not([hidden]){animation:navin .45s var(--ease)}
.sw i,.sw i:after{transition:background-color .25s,transform .3s var(--spring)}
@keyframes inF{from{opacity:0;transform:translateX(30px)}}
@keyframes inB{from{opacity:0;transform:translateX(-30px)}}
@keyframes inU{from{opacity:0;transform:translateY(12px)}}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes growY{from{transform:scaleY(0)}}
@keyframes navin{from{transform:translateY(100%)}}
@keyframes fade{from{opacity:0}}
@keyframes pop{0%{transform:scale(.4)}60%{transform:scale(1.35)}100%{transform:scale(1)}}
@keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
#ap.f{animation:inF .4s var(--ease)}
#ap.b{animation:inB .4s var(--ease)}
#ap.x>*{animation:inU .45s var(--ease) both}
#ap.x>*:nth-child(2){animation-delay:.04s}#ap.x>*:nth-child(3){animation-delay:.08s}#ap.x>*:nth-child(4){animation-delay:.12s}
#ap.x>*:nth-child(5){animation-delay:.16s}#ap.x>*:nth-child(n+6){animation-delay:.2s}
#ap.x .stk i{transform-origin:left;animation:grow .7s var(--ease) .15s both}
#ap.x .bars i{transform-origin:bottom;animation:growY .7s var(--ease) .15s both}
.lk:not([hidden]){animation:fade .25s}
.dots i{transition:background-color .15s,border-color .15s}
.dots i.n{animation:pop .25s var(--spring)}
.dots.sh{animation:shake .4s}
/* pengaturan ala iOS */
.nb{margin:0 0 2px}
.bk{background:none;border:0;color:var(--g);font:inherit;font-size:17px;padding:8px 6px 8px 0;min-height:40px}
.gl{color:var(--m);font-size:13px;text-transform:uppercase;letter-spacing:.04em;margin:18px 4px 8px}
.grp{background:var(--c);border:1px solid var(--l);border-radius:20px;overflow:hidden}
.row2{display:flex;align-items:center;gap:12px;padding:12px 14px;transition:background-color .2s}
.row2+.row2{border-top:1px solid var(--l)}
.row2:active{background:var(--c2)}
.row2 .g{flex:1;min-width:0}
.chev{color:var(--m);font-size:22px;line-height:1}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="ap" class="w"></div>
<nav id="nv" hidden></nav>
<button class="fab h" id="fab" aria-label="Tambah">+</button>
<div class="md" id="md"><div id="mb"></div></div>
<div class="lk" id="lk" hidden></div>

<script>
// URL Web App Apps Script (berakhiran /exec). Ganti jika Anda deploy ulang dengan URL baru.
const API='https://script.google.com/macros/s/AKfycbwsydprPvuZ8Y0gBVPBUdaFF1nPN45H6HRuAKUhZgGLXlhTwEbLRH8QMDn-sqQwvdTH/exec';

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rp=n=>(n<0?'-':'')+'Rp'+Math.abs(Math.round(n)).toLocaleString('id-ID');
const BL=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const COL=['#f59e0b','#eab308','#22c55e','#14b8a6','#ec4899','#a855f7','#3b82f6','#ef4444'];
const ICO=[[/makan|food|minum/i,'🍔'],[/transport|bensin|ojek/i,'🚌'],[/grocer|harian/i,'🛒'],[/tagih|bill|listrik|pulsa/i,'🧾'],
  [/hibur|entertain|game/i,'🎬'],[/keluarga|family/i,'👨‍👩‍👧'],[/shop|belanja/i,'🛍️'],[/gaji|salary/i,'💼'],[/bonus|hadiah/i,'🎁']];
const kcol=n=>COL[[...String(n)].reduce((a,c)=>a+c.charCodeAt(0),0)%8];
const emj=n=>(ICO.find(([r])=>r.test(n))||[0,'🏷️'])[1];
const ic=c=>`<div class="ic" style="background:${kcol(c.id||c.nama)}33">${esc(c.ikon||emj(c.nama))}</div>`;
const lgo=b=>b.logo?`<img class="ic" src="${esc(b.logo)}" alt="">`:`<div class="ic" style="background:${kcol(b.id||b.nama)}33;color:${kcol(b.id||b.nama)}">${esc(String(b.nama||'?')[0])}</div>`;
const today=()=>new Date().toLocaleDateString('sv');
const sw=(on,h)=>`<label class="sw" onclick="event.stopPropagation()"><input type="checkbox" ${on?'checked':''} onchange="${h}"><i></i></label>`;
const EMPTY={banks:[],cats:[],trx:[],ang:[],aset:[],utang:[],rutin:[]};

let S={...EMPTY},tab='trx',sub='bersih',pg='',ym=today().slice(0,7),hide=false,F={},R={},LG,LGP,PIN='',pb='',busy=false,hid=0;
try{PIN=sessionStorage.getItem('pin')||''}catch(e){}
const bn=i=>(S.banks.find(b=>b.id==i)||{nama:'(dompet dihapus)'}).nama;
const mt=()=>S.trx.filter(t=>String(t.tanggal).startsWith(ym));
const sum=(l,tp)=>l.filter(t=>t.tipe==tp).reduce((a,t)=>a+Number(t.jumlah),0);
const bTot=()=>S.banks.reduce((a,b)=>a+Number(b.saldo),0);
const aTot=()=>S.aset.filter(a=>a.aktif!==false).reduce((a,x)=>a+Number(x.nilai),0);
const total=()=>bTot();   // total saldo = dompet saja; aset (investasi) hanya masuk nilai bersih

/* ---------- API & kunci PIN ---------- */
async function api(a,d={}){
  const r=await fetch(API,{method:'POST',body:JSON.stringify({a,pin:PIN,...d})});
  const j=await r.json();
  if(j.err){const e=Error(j.err);e.auth=!!j.auth;throw e}
  if(!Array.isArray(j.rutin))throw Error('Code.gs di Apps Script masih versi lama. Tempel Code.gs terbaru, lalu Deploy, Manage deployments, Edit, New version');
  S={...EMPTY,...j};return j.r;
}
function fail(e){if(e.auth)lock(e.message);else alert(e.message)}
async function run(a,d,btn){
  const t=btn&&btn.textContent;
  if(btn){btn.disabled=true;btn.textContent='Menyimpan…'}
  try{await api(a,d);closeM();draw();return true}
  catch(e){fail(e);if(btn){btn.disabled=false;btn.textContent=t}return false}
}
async function init(){
  if(!PIN)return lockUI();
  $('#ap').innerHTML='<p class="mt">Memuat data…</p>';
  try{await api('getAll');draw('x')}
  catch(e){
    if(e.auth)return lock(e.message);
    $('#ap').innerHTML=`<div class="card"><b class="out">Gagal memuat data</b><p class="mt">${esc(e.message)}. Pastikan URL API di index.html benar dan Web App di-deploy dengan akses Anyone.</p>
      <button class="sv" style="margin-top:8px" onclick="init()">Coba lagi</button></div>`;
  }
}
function lock(msg=''){
  PIN='';pb='';try{sessionStorage.removeItem('pin')}catch(e){}
  S={...EMPTY};closeM();$('#ap').innerHTML='';$('#nv').hidden=true;$('#fab').classList.add('h');lockUI(msg);
}
function lockUI(msg='',bad=true){
  $('#lk').hidden=false;
  const keys=[1,2,3,4,5,6,7,8,9,'<',0,'ok'];
  $('#lk').innerHTML=`<div class="lkb"><div class="lg">🐷</div><h1>Celengan</h1><p class="mt" style="margin:0">Masukkan PIN</p>
    <div class="dots ${msg&&bad?'sh':''}">${[...Array(Math.max(4,pb.length))].map((_,i)=>`<i class="${i<pb.length?'f':''} ${i==pb.length-1?'n':''}"></i>`).join('')}</div>
    <p class="${bad?'out':'mt'}" style="min-height:22px;margin:6px 0">${esc(msg)}</p>
    <div class="kp">${keys.map(k=>`<button class="${k=='ok'?'ok':''}" onclick="kp('${k}')" aria-label="${k=='<'?'Hapus':k=='ok'?'Masuk':k}">${k=='<'?'⌫':k=='ok'?'✓':k}</button>`).join('')}</div></div>`;
}
function kp(k){
  if(busy)return;
  if(k=='ok')return submitPin();
  if(k=='<')pb=pb.slice(0,-1);else if(pb.length<8)pb+=k;
  lockUI();
}
async function submitPin(){
  if(!pb||busy)return;
  busy=true;PIN=pb;lockUI('Memeriksa…',false);
  try{await api('login');try{sessionStorage.setItem('pin',PIN)}catch(e){}pb='';$('#lk').hidden=true;draw('x')}
  catch(e){PIN='';pb='';lockUI(e.auth?e.message:'Gagal terhubung: '+e.message)}
  busy=false;
}
addEventListener('keydown',e=>{
  if($('#lk').hidden)return;
  if(/^\d$/.test(e.key))kp(e.key);else if(e.key=='Backspace')kp('<');else if(e.key=='Enter')kp('ok');
});
document.addEventListener('visibilitychange',()=>{ // kunci otomatis setelah 3 menit di latar belakang
  if(document.hidden)hid=Date.now();else if(PIN&&hid&&Date.now()-hid>180000)lock();
});

/* ---------- komponen ---------- */
function chips(){
  const n=new Date(),a=[];
  for(let i=11;i>=0;i--)a.push(new Date(n.getFullYear(),n.getMonth()-i,1));
  return `<div class="chips">${a.map(d=>{const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
    return `<button class="chip ${k==ym?'on':''}" onclick="ym='${k}';draw()">${BL[d.getMonth()]} ${d.getFullYear()}</button>`}).join('')}</div>`;
}
const row=t=>{
  const k=S.cats.find(c=>c.id==t.kategori),tr=t.tipe=='transfer',m=t.tipe=='masuk';
  return `<div class="it" onclick="if(confirm('Hapus transaksi ini? Saldo akan dikembalikan.'))run('delTrx',{id:'${t.id}'})">
    ${tr?'<div class="ic" style="background:#ffffff1f">🔁</div>':ic(k||{nama:'?'})}
    <div class="g"><b>${tr?esc(bn(t.bank))+' ke '+esc(bn(t.bank2)):esc(k?k.nama:'Tanpa kategori')}</b>
    <small>${tr?'Transfer':esc(bn(t.bank))}${t.catatan?' - '+esc(t.catatan):''}</small></div>
    <b class="${m?'in':tr?'':'out'}">${m?'+':tr?'':'-'}${rp(t.jumlah)}</b></div>`;
};
const donut=(l,tipe,judul)=>{
  const m={};
  l.filter(t=>t.tipe==tipe).forEach(t=>{const c=S.cats.find(c=>c.id==t.kategori)||{id:'?',nama:'Tanpa kategori'};
    (m[c.id]=m[c.id]||{c,v:0}).v+=Number(t.jumlah)});
  const e=Object.values(m).sort((a,b)=>b.v-a.v),tot=e.reduce((a,x)=>a+x.v,0);let cu=0;
  const g=e.map(({c,v})=>{const s=cu;cu+=v/tot*100;return `${kcol(c.id)} ${s}% ${cu}%`}).join(',');
  return `<div class="card"><div class="rw"><b>${judul}</b><b>${rp(tot)}</b></div>
    ${tot?`<div class="pie" style="background:conic-gradient(${g})"></div>`:'<p class="mt" style="text-align:center;padding:24px 0">Tidak ada data bulan ini</p>'}
    ${e.map(({c,v})=>`<div class="it"><span class="dot" style="background:${kcol(c.id)}"></span><span class="g">${esc(c.nama)}</span><span>${Math.round(v/tot*100)}%</span><b>${rp(v)}</b></div>`).join('')}</div>`;
};

const V={
  trx(){
    const l=mt(),h=x=>hide?'Rp •••••':rp(x),days=[...new Set(l.map(x=>x.tanggal))].sort().reverse();
    return chips()+`<div class="hero"><small>Total saldo</small>
      <div class="big">${h(total())}<button class="eye" onclick="hide=!hide;draw()" aria-label="Tampilkan atau sembunyikan saldo">${hide?'🙈':'👁'}</button></div>
      <div class="pp"><div><small>Pemasukan</small><b>${h(sum(l,'masuk'))}</b></div><div><small>Pengeluaran</small><b>${h(sum(l,'keluar'))}</b></div></div></div>`+
      (days.map(d=>`<div class="day">${new Date(d+'T00:00').toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long'})}</div>`+l.filter(x=>x.tanggal==d).map(row).join('')).join('')+
      (l.length?'<p class="mt" style="font-size:12px;margin-top:16px">Ketuk transaksi untuk menghapus.</p>':
      '<div class="card empty"><b>Belum ada transaksi</b><p class="mt">Tambahkan pemasukan atau pengeluaran pertama Anda. Hanya butuh hitungan detik.</p></div>'));
  },
  ring(){
    const l=mt(),tr=[...Array(6)].map((_,i)=>{
      const d=new Date(+ym.slice(0,4),+ym.slice(5)-1-(5-i),1),k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
      return [BL[d.getMonth()],sum(S.trx.filter(t=>String(t.tanggal).startsWith(k)),'keluar')];
    }),mx=Math.max(...tr.map(x=>x[1]),1);
    return `<h1>Ringkasan</h1>`+chips()+
      `<div class="card"><div class="rw"><b>Tren pengeluaran</b><small class="mt">6 bulan terakhir</small></div>
      <div class="bars">${tr.map(([m,v])=>`<div><i style="height:${v/mx*100}%"></i><small>${m}</small></div>`).join('')}</div></div>`+

    (tr?`<div class="fr"><span>Ke</span><select onchange="F.bank2=this.value">${bo(F.bank2)}</select></div>`:'')+

const shrink=f=>new Promise((ok,no)=>{
  const i=new Image();
  i.onload=()=>{const c=document.createElement('canvas');c.width=c.height=96;const x=c.getContext('2d'),s=Math.min(i.width,i.height);
    x.drawImage(i,(i.width-s)/2,(i.height-s)/2,s,s,0,0,96,96);
    let u=c.toDataURL('image/png');if(u.length>40000)u=c.toDataURL('image/jpeg',.7);
    URL.revokeObjectURL(i.src);ok(u)};
  i.onerror=()=>no(Error('Gambar tidak bisa dibaca'));
  i.src=URL.createObjectURL(f);
});
function pickLogo(inp){LG=undefined;LGP=inp.files[0]?shrink(inp.files[0]):null}
async function saveBank(id,btn){
  const d={id,nama:$('#bn').value.trim(),tipe:$('#bt').value,rek:$('#br').value.trim(),saldo:Number($('#bs').value)||0};

  btn.disabled=true;
  try{if(LGP)d.logo=await LGP;else if(LG==='')d.logo=''}
  catch(e){btn.disabled=false;return alert(e.message)}
  run('saveBank',d,btn);
}

  try{await api('toggleAset',{id,aktif:on});
    const b=S.aset.find(x=>x.id==id);
    if(b&&b.aktif!==on){alert('Status aset tidak tersimpan di Sheet. Pastikan tab Aset punya kolom aktif dan Code.gs sudah versi terbaru.')}
    draw()}catch(e){fail(e);if(!e.auth)init()}
}

/* ---------- utang ---------- */
function utangForm(){
  modal('Catat utang',`<div class="fr"><span>Jenis</span><select id="ut"><option value="pinjam">Saya meminjam</option><option value="beri">Saya meminjamkan</option></select></div>
    <div class="fr"><span>Nama</span><input id="un" placeholder="Nama orang"></div>
    <div class="fr"><span>Jumlah</span><input id="uj" type="number" inputmode="decimal"></div>
    <div class="fr"><span>Catatan</span><input id="uc" placeholder="Opsional"></div>
    <button class="sv" onclick="saveUtang(this)">Simpan</button>`);
}
function saveUtang(btn){
  const d={tipe:$('#ut').value,nama:$('#un').value.trim(),jumlah:Number($('#uj').value),catatan:$('#uc').value};
  if(!d.nama||!(d.jumlah>0))return alert('Isi nama dan jumlah');
  run('saveUtang',d,btn);
}
function utangDetail(id){
  const u=S.utang.find(x=>x.id==id);
  modal(esc(u.nama),`<p class="mt">Sisa ${rp(u.sisa)} dari ${rp(u.jumlah)}</p>
    <div class="fr"><span>Jumlah dibayar</span><input id="uj" type="number" inputmode="decimal"></div>
    <button class="sv" onclick="const j=Number($('#uj').value);j>0?run('bayarUtang',{id:'${id}',jumlah:j},this):alert('Isi jumlah lebih dari 0')">Catat pembayaran</button>${del('delUtang',id,'Hapus catatan utang ini?')}`);
}

/* ---------- transaksi otomatis (gaji dll.) ---------- */
function rutinForm(id){
  if(!S.banks.length)return alert('Tambah dompet dulu di Akun, Pengaturan, Dompet.');
  const r=S.rutin.find(x=>x.id==id);
  R=r?{...r}:{id:'',nama:'',tipe:'masuk',jumlah:'',hari:25,bank:S.banks[0].id,kategori:'',aktif:true};
  rr();
}
function rr(){
  const ks=S.cats.filter(c=>c.tipe==R.tipe);
  if(!ks.find(c=>c.id==R.kategori))R.kategori=ks[0]?ks[0].id:'';
  modal(R.id?'Edit otomatis':'Tambah otomatis',
    `<div class="fr"><span>Nama</span><input placeholder="Gaji bulanan" value="${esc(R.nama)}" oninput="R.nama=this.value"></div>
    <div class="fr"><span>Tiap tanggal</span><input type="number" inputmode="numeric" min="1" max="31" value="${esc(R.hari)}" oninput="R.hari=this.value" style="width:90px"></div>
    <div class="fr"><span>Masuk ke dompet</span><select onchange="R.bank=this.value">${S.banks.map(b=>`<option value="${b.id}" ${b.id==R.bank?'selected':''}>${esc(b.nama)}</option>`).join('')}</select></div>
    <div class="fr"><span>Kategori</span><select onchange="R.kategori=this.value">${ks.map(c=>`<option value="${c.id}" ${c.id==R.kategori?'selected':''}>${esc(c.nama)}</option>`).join('')||'<option value="">(belum ada)</option>'}</select></div>
    <div class="fr"><span>Aktif</span><label class="sw"><input type="checkbox" ${R.aktif?'checked':''} onchange="R.aktif=this.checked"><i></i></label></div>
    <p class="mt" style="font-size:12px">Tanggal 29 sampai 31 otomatis menyesuaikan akhir bulan yang lebih pendek. Jika tanggal bulan ini sudah lewat, mulai berjalan bulan depan.</p>
    <button class="sv" onclick="saveRutin(this)">Simpan</button>${R.id?del('delRutin',R.id,'Hapus transaksi otomatis ini? Transaksi yang sudah tercatat tetap ada.'):''}`,
    `<div class="seg">${[['masuk','Pemasukan'],['keluar','Pengeluaran']].map(([k,l])=>`<button class="${R.tipe==k?'on':''}" onclick="R.tipe='${k}';rr()">${l}</button>`).join('')}</div>
    <input class="amt" type="number" inputmode="decimal" placeholder="0" value="${esc(R.jumlah)}" oninput="R.jumlah=this.value">`);
}
function saveRutin(btn){
  const j=Number(R.jumlah),h=Math.round(Number(R.hari));
  if(!String(R.nama).trim())return alert('Isi nama');
  if(!(j>0))return alert('Isi jumlah lebih dari 0');
  if(!(h>=1&&h<=31))return alert('Tanggal harus 1 sampai 31');
  run('saveRutin',{id:R.id,nama:String(R.nama).trim(),tipe:R.tipe,jumlah:j,hari:h,bank:R.bank,kategori:R.kategori,aktif:R.aktif},btn);
}
async function togR(id,on){
  const r=S.rutin.find(x=>x.id==id);if(r)r.aktif=on;draw();
  try{await api('toggleRutin',{id,aktif:on});draw()}catch(e){fail(e);if(!e.auth)init()}
}

let tx=0,ty=0;
addEventListener('touchstart',e=>{const t=e.touches[0];tx=t.clientX;ty=t.clientY},{passive:true});
addEventListener('touchend',e=>{const t=e.changedTouches[0];
  if(tab=='akun'&&sub=='set'&&pg&&!$('#md').classList.contains('o')&&tx<40&&t.clientX-tx>80&&Math.abs(t.clientY-ty)<60)back()},{passive:true});
const FA={dompet:()=>bankForm(),aset:()=>asetForm(),utang:()=>utangForm(),kat:()=>katForm('','keluar'),rutin:()=>rutinForm()};
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
init();
</script>
</body>
</html>
