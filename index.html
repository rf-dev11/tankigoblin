<style>
:root{--bg:#000;--c:#1c1c1e;--c2:#2c2c2e;--g:#0bc78d;--gd:#06935f;--y:#ffd60a;--t:#f5f5f7;--m:#98989f;--r:#ff453a;--l:#2c2c2e;color-scheme:dark;--ease:cubic-bezier(.32,.72,0,1);--spring:cubic-bezier(.34,1.56,.64,1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:radial-gradient(120% 50% at 50% -8%,#0d2a23 0,#000 62%) fixed,#000;color:var(--t);font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;padding-bottom:calc(90px + env(safe-area-inset-bottom));overscroll-behavior-y:none}

.w{max-width:520px;margin:auto;padding:16px;padding-top:calc(16px + env(safe-area-inset-top))}

.mt{color:var(--m)}.in{color:var(--g)}.out{color:var(--r)}.warn{color:var(--y)}

.pp{display:flex;gap:10px}.pp div{flex:1;background:#00000028;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-radius:18px;padding:12px}.pp b{display:block;font-size:17px}.pp small{font-weight:600}
.card{background:var(--c);border-radius:22px;padding:16px;margin-bottom:14px;box-shadow:inset 0 1px 0 #ffffff0d}

.ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;flex:none;object-fit:cover;font-weight:700}

nav{position:fixed;bottom:0;left:0;right:0;width:100%;background:#1c1c1ecc;-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);display:flex;gap:4px;padding:8px max(8px,env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));border-top:.5px solid #ffffff1f;z-index:5}

.fab{position:fixed;right:18px;bottom:calc(92px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;border:0;background:linear-gradient(145deg,#12d9a0,#0bc78d);color:#fff;font-size:34px;font-weight:300;box-shadow:0 10px 24px #0bc78d55;z-index:4}

.amt{width:100%;background:none;border:0;color:#fff;font-size:40px;font-weight:700;outline:0;padding:0}.amt::placeholder{color:#ffffff80}

.fr select,.fr input{background:none;border:0;color:var(--t);font:inherit;font-size:16px;text-align:right;max-width:68%;min-width:0;outline:0}
.fr select option,.fr select optgroup{background:var(--c);color:var(--t)}
.lb{color:var(--m);margin:16px 0 8px}
.cg{display:flex;flex-wrap:wrap;gap:8px}

.sv{width:100%;margin-top:24px;background:linear-gradient(145deg,#12d9a0,#0bc78d);color:#fff;border:0;border-radius:14px;padding:15px;font:inherit;font-weight:700;min-height:50px;box-shadow:0 6px 16px #0bc78d33}
.sv:disabled{opacity:.6}
.x{background:none;border:0;color:var(--r);font:inherit;padding:6px;min-height:36px}
.stk{display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--c2);margin:10px 0}.stk i{display:block;height:100%}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--g);outline-offset:2px}
.sw{position:relative;width:48px;height:28px;flex:none;display:inline-block}
.sw input{position:absolute;inset:-8px;opacity:0;width:calc(100% + 16px);height:calc(100% + 16px);margin:0;z-index:1;cursor:pointer;max-width:none}

.lk{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;align-items:center;justify-content:center;padding:calc(20px + env(safe-area-inset-top)) 20px calc(20px + env(safe-area-inset-bottom));overflow:auto}
.lkb{width:100%;max-width:320px;text-align:center}
.lkb h1{margin:8px 0 4px}.lkb .lg{font-size:48px}

.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--m)}.dots i.f{background:var(--g);border-color:var(--g)}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px}
.kp button{height:66px;border-radius:22px;border:0;background:var(--c2);color:var(--t);font:inherit;font-size:26px;font-weight:600}
.kp button:active{background:var(--gd)}.kp .ok{background:var(--g);color:#fff}
/* animasi ala iOS */
button,.chip,.ch,.sv,.x{transition:transform .2s var(--ease),opacity .2s,background-color .25s,color .25s,border-color .25s}
button:active{transform:scale(.95);opacity:.8}
.sv:active{transform:scale(.98)}
.fab{transition:transform .35s var(--spring),opacity .25s}
.fab:active{transform:scale(.88);opacity:1}
.fab.h{transform:scale(.3);opacity:0;pointer-events:none}
.it[onclick]{transition:opacity .15s}.it[onclick]:active{opacity:.5}
.card[onclick]{transition:transform .2s var(--ease),background-color .2s}.card[onclick]:active{transform:scale(.985);background:#2a2a2c}
nav button span{transition:transform .35s var(--spring)}
nav .on span{transform:translateY(-2px) scale(1.18)}
nav:not([hidden]){animation:navin .45s var(--ease)}
.sw i,.sw i:after{transition:background-color .25s,transform .3s var(--spring)}
@keyframes inF{from{opacity:0;transform:translateX(30px)}}
@keyframes inB{from{opacity:0;transform:translateX(-30px)}}
@keyframes inU{from{opacity:0;transform:translateY(12px)}}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes growY{from{transform:scaleY(0)}}
@keyframes navin{from{transform:translateY(100%)}}
@keyframes fade{from{opacity:0}}
@keyframes pop{0%{transform:scale(.4)}60%{transform:scale(1.35)}100%{transform:scale(1)}}
@keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
@keyframes spin{to{transform:rotate(360deg)}}
#ap.f{animation:inF .4s var(--ease)}
#ap.b{animation:inB .4s var(--ease)}
#ap.enter>*{animation:inU .45s var(--ease) both}
#ap.enter>*:nth-child(2){animation-delay:.04s}#ap.enter>*:nth-child(3){animation-delay:.08s}#ap.enter>*:nth-child(4){animation-delay:.12s}
#ap.enter>*:nth-child(5){animation-delay:.16s}#ap.enter>*:nth-child(n+6){animation-delay:.2s}
#ap.enter .stk i{transform-origin:left;animation:grow .7s var(--ease) .15s both}
#ap.enter .bars i{transform-origin:bottom;animation:growY .7s var(--ease) .15s both}
.lk:not([hidden]){animation:fade .25s}
.dots i{transition:background-color .15s,border-color .15s}
.dots i.n{animation:pop .25s var(--spring)}
.dots.sh{animation:shake .4s}
/* pengaturan ala iOS */
.nb{margin:0 0 2px}
.bk{background:none;border:0;color:var(--g);font:inherit;font-size:17px;padding:8px 6px 8px 0;min-height:40px}
.gl{color:var(--m);font-size:13px;text-transform:uppercase;letter-spacing:.04em;margin:18px 4px 8px}
.grp{background:var(--c);border-radius:22px;overflow:hidden}
.grp>.it{padding:12px 14px}.grp>.it+.it{border-top:.5px solid #ffffff1a}
.row2{display:flex;align-items:center;gap:12px;padding:12px 14px;transition:background-color .2s}
.row2+.row2{border-top:.5px solid #ffffff1a}
.row2:active{background:var(--c2)}
.row2 .g{flex:1;min-width:0}
.chev{color:var(--m);font-size:22px;line-height:1}
/* popup mini sukses / gagal */
.ts{position:fixed;top:calc(10px + env(safe-area-inset-top));left:50%;z-index:30;max-width:min(92vw,420px);display:flex;align-items:center;gap:8px;background:#2c2c2ee8;-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border:.5px solid #ffffff24;border-radius:99px;padding:10px 18px;font-size:14px;font-weight:600;box-shadow:0 10px 30px #0009;transform:translate(-50%,-160%);opacity:0;pointer-events:none;transition:transform .45s var(--spring),opacity .25s}
.ts.on{transform:translate(-50%,0);opacity:1}
.ts.ok{color:var(--g)}.ts.bad{color:var(--r);border-radius:18px}
.sp{display:inline-block;flex:none;width:14px;height:14px;border:2px solid #ffffff44;border-top-color:var(--g);border-radius:50%;animation:spin .7s linear infinite}
/* tata letak */
#ap{width:100%;min-width:0;color:var(--t)}
#ap>*{min-width:0}
.card,.hero,.grp{overflow-wrap:anywhere}
.it .g,.row2 .g{overflow-wrap:anywhere;word-break:break-word}
.chips{overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch}
@media (max-width:360px){
  .w{padding-left:12px;padding-right:12px}
  .chips{margin-left:-12px;margin-right:-12px;padding-left:12px;padding-right:12px}
  h1{font-size:28px}
  .hero{padding:18px}
  .pp{gap:8px}.pp div{padding:10px}.pp b{font-size:15px}
  .chip{padding:8px 14px}
  nav{gap:2px}nav span{font-size:18px}
  .fr{gap:8px}.fr select,.fr input{max-width:64%;font-size:15px}
  .amt{font-size:34px}
}
/* iPad portrait */
@media (min-width:700px){
  .w,#mb{max-width:640px}
  .md{background:#0009;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
  #mb{background:var(--bg);margin:5vh auto;border-radius:28px;overflow:hidden;box-shadow:0 0 40px #0008}
  .mh{border-radius:0}
  nav{left:0;right:0;margin:0 auto;bottom:calc(12px + env(safe-area-inset-bottom));width:min(calc(100% - 48px),480px);border-radius:26px;border:.5px solid #ffffff24}
  .fab{bottom:calc(104px + env(safe-area-inset-bottom));right:max(18px,calc((100vw - 640px)/2 + 18px))}
  body{padding-bottom:calc(130px + env(safe-area-inset-bottom))}
}
/* iPad landscape / layar lebar: tab bar jadi sidebar */
@media (min-width:1024px){
  body{padding-left:108px;padding-bottom:40px}
  nav{top:0;bottom:0;left:0;right:auto;margin:0;width:108px;flex-direction:column;justify-content:center;gap:10px;padding:20px 10px;border-radius:0;border:0;border-right:.5px solid #ffffff1f}
  nav button{flex:none;min-height:68px}
  .w,#mb{max-width:720px}
  .fab{bottom:32px;right:max(24px,calc((100vw - 108px - 720px)/2 + 18px))}
}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}

<body>
<div id="ap" class="w"></div>
<nav id="nv" hidden></nav>
<button class="fab h" id="fab" aria-label="Tambah">+</button>
<div class="md" id="md"><div id="mb"></div></div>

<script>
// URL Web App Apps Script (berakhiran /exec). Ganti jika Anda deploy ulang dengan URL baru.
const API='https://script.google.com/macros/s/AKfycbxX9DAqvx11dNGew-GczIdmTti6-qzvro4mNaHu36Av5tCusnK6UnmU5OmpAyPv_Srl/exec';

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rp=n=>(n<0?'-':'')+'Rp'+Math.abs(Math.round(n)).toLocaleString('id-ID');
const BL=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const COL=['#f59e0b','#eab308','#22c55e','#14b8a6','#ec4899','#a855f7','#3b82f6','#ef4444'];
const ICO=[[/makan|food|minum/i,'🍔'],[/transport|bensin|ojek/i,'🚌'],[/grocer|harian/i,'🛒'],[/tagih|bill|listrik|pulsa/i,'🧾'],
  [/hibur|entertain|game/i,'🎬'],[/keluarga|family/i,'👨‍👩‍👧'],[/shop|belanja/i,'🛍️'],[/gaji|salary/i,'💼'],[/bonus|hadiah/i,'🎁']];
const kcol=n=>COL[[...String(n)].reduce((a,c)=>a+c.charCodeAt(0),0)%8];
const emj=n=>(ICO.find(([r])=>r.test(n))||[0,'🏷️'])[1];
const ic=c=>`<div class="ic" style="background:${kcol(c.id||c.nama)}33">${esc(c.ikon||emj(c.nama))}</div>`;
const lgo=b=>b.logo?`<img class="ic" src="${esc(b.logo)}" alt="">`:`<div class="ic" style="background:${kcol(b.id||b.nama)}33;color:${kcol(b.id||b.nama)}">${esc(String(b.nama||'?')[0])}</div>`;
const today=()=>new Date().toLocaleDateString('sv');
const nowT=()=>new Date().toTimeString().slice(0,5);
const sw=(on,h)=>`<label class="sw" onclick="event.stopPropagation()"><input type="checkbox" ${on?'checked':''} onchange="${h}"><i></i></label>`;
const EMPTY={banks:[],cats:[],trx:[],ang:[],aset:[],utang:[],rutin:[],target:[],riw:[]};

  const TEMA={hijau:['Hijau','#9dc03f'],biru:['Biru','#5b96ea'],oranye:['Oranye','#f4694b'],kuning:['Kuning','#f2b233'],pink:['Pink','#f58ac0'],ungu:['Ungu','#a58bf0'],tosca:['Tosca','#3fd0c0'],merah:['Merah','#e8453c'],krem:['Krem','#e6dfc8']};
let tema='hijau';try{tema=localStorage.getItem('tema')||'hijau'}catch(e){}
function setTema(k,x){
  if(!TEMA[k])k='hijau';tema=k;document.documentElement.dataset.tema=k;
  const m=document.querySelector('meta[name=theme-color]');if(m)m.content=TEMA[k][1];
  try{localStorage.setItem('tema',k)}catch(e){}
  if(!x)draw();
}
setTema(tema,1);
const mi=b=>b.logo?`<img class="mi" src="${esc(b.logo)}" alt="">`:`<i class="mi" style="background:${kcol(b.id||b.nama)}">${esc(String(b.nama||'?')[0])}</i>`;
const bm=i=>{const a=isA(i),o=a?S.aset.find(x=>x.id==String(i).slice(2)):S.banks.find(x=>x.id==i);
  return `<span class="bm">${o?mi(o):''}${esc(o?o.nama:a?'(aset dihapus)':'(dompet dihapus)')}</span>`};
function pick(w,k,as){
  const O=w=='F'?F:R,
    li=(v,o)=>`<button class="po ${O[k]==v?'on':''}" onclick="pset('${w}','${k}','${v}')">${mi(o)}<span class="g">${esc(o.nama)}</span><small>${rp(o.saldo??o.nilai)}</small></button>`;
  const d=document.createElement('div');d.className='pl';d.id='pl';
  d.onclick=e=>{if(e.target==d)d.remove()};
  d.innerHTML=`<div class="plb"><p class="gl">Dompet</p>${S.banks.map(b=>li(b.id,b)).join('')}`+
    (as&&S.aset.length?`<p class="gl">Aset / investasi</p>${S.aset.map(a=>li('a:'+a.id,a)).join('')}`:'')+`</div>`;
  document.body.appendChild(d);
}
function pset(w,k,v){(w=='F'?F:R)[k]=v;$('#pl').remove();w=='F'?fr():rr()}

let S={...EMPTY},tab='trx',sub='bersih',pg='',ym=today().slice(0,7),hide=false,F={},R={},LG,LGP,PIN='',pb='',busy=false,hid=0;
try{PIN=sessionStorage.getItem('pin')||''}catch(e){}
const bn=i=>(S.banks.find(b=>b.id==i)||{nama:'(dompet dihapus)'}).nama;
const isA=i=>String(i).startsWith('a:');   // tujuan transfer berupa aset: "a:<id aset>"
const bn2=i=>isA(i)?(S.aset.find(a=>a.id==String(i).slice(2))||{nama:'(aset dihapus)'}).nama:bn(i);
const mt=()=>S.trx.filter(t=>String(t.tanggal).startsWith(ym));
const sum=(l,tp)=>l.filter(t=>t.tipe==tp&&t.kategori!='adj').reduce((a,t)=>a+Number(t.jumlah),0)+(tp=='keluar'?l.filter(t=>t.tipe=='transfer').reduce((a,t)=>a+Number(t.biaya||0),0):0);
const bTot=()=>S.banks.reduce((a,b)=>a+Number(b.saldo),0);
const aTot=()=>S.aset.filter(a=>a.aktif!==false).reduce((a,x)=>a+Number(x.nilai),0);
const adj=(id,v)=>{const b=S.banks.find(x=>x.id==id);if(b)b.saldo=Number(b.saldo)+v};
const adjA=(id,v)=>{const a=S.aset.find(x=>x.id==String(id).slice(2));if(a)a.nilai=Number(a.nilai)+v};
function applyTrx(t,s){   // sama dengan Code.gs: dipakai untuk update lokal instan
  const j=Number(t.jumlah)*s,f=Number(t.biaya||0)*s;
  if(t.tipe=='masuk')adj(t.bank,j);else if(t.tipe=='keluar')adj(t.bank,-j);
  else{adj(t.bank,-j-f);isA(t.bank2)?adjA(t.bank2,j):adj(t.bank2,j)}
}
const total=()=>bTot();   // total saldo = dompet saja; aset (investasi) hanya masuk nilai bersih

/* ---------- API & kunci PIN ---------- */
async function api(a,d={},keep){
  const r=await fetch(API,{method:'POST',body:JSON.stringify({a,pin:PIN,...d})});
  const j=await r.json();
  if(j.err){const e=Error(j.err);e.auth=!!j.auth;throw e}
  if(!Array.isArray(j.rutin))throw Error('Code.gs di Apps Script masih versi lama. Tempel Code.gs terbaru, lalu Deploy, Manage deployments, Edit, New version');
  if(PIN&&!(keep&&Q.length))S={...EMPTY,...j};return j.r;
}
function fail(e){if(e.auth)lock(e.message);else alert(e.message)}

/* ---------- antrean latar belakang: simpan ke Sheet tetap jalan walau pindah menu ---------- */
let Q=[],qb=false,qf=false,tt;
const SP='<i class="sp"></i>';
function toast(h,c,ms){const t=$('#ts');clearTimeout(tt);t.className='ts on '+(c||'');t.innerHTML=h;if(ms)tt=setTimeout(()=>t.classList.remove('on'),ms)}
function run(a,d,btn,local){closeM();bg(a,d,local)}
function bg(a,d,local){
  if(local)local();
  Q.push({a,d});draw();
  if(!qf)toast(SP+'Menyimpan'+(Q.length>1?' ('+Q.length+')':'')+'…','');
  pump();
}
async function pump(){
  if(qb)return;qb=true;
  while(Q.length){
    const j=Q.shift();
    try{await api(j.a,j.d,true);if(!qf)Q.length?toast(SP+'Menyimpan…',''):toast('✓ Tersimpan','ok',2200)}
    catch(e){
      if(e.auth){Q=[];qb=false;qf=false;$('#ts').classList.remove('on');return lock(e.message)}
      qf=true;toast('✕ Gagal menyimpan: '+esc(e.message),'bad',6000);
    }
  }
  qb=false;if(!PIN)return;
  if(qf){qf=false;try{await api('getAll')}catch(e){}}   // gagal: ambil ulang data asli dari Sheet
  draw();
}
addEventListener('beforeunload',e=>{if(Q.length||qb){e.preventDefault();e.returnValue=''}});
function delTrx(id){
  if(!confirm('Hapus transaksi ini? Saldo akan dikembalikan.'))return;
  run('delTrx',{id},0,()=>{const t=S.trx.find(x=>x.id==id);if(t){applyTrx(t,-1);S.trx=S.trx.filter(x=>x!=t)}});
}

async function init(){
  if(!PIN)return lockUI();
 $('#ap').innerHTML='<div class="ld"><b>Memuat data…</b><iframe src="https://giphy.com/embed/4E4KqxulO9JtRF8s6T" frameborder="0" allowfullscreen></iframe><a href="https://giphy.com/gifs/cat-loading-mimibarbar-4E4KqxulO9JtRF8s6T" target="_blank" rel="noopener">via GIPHY</a></div>';
  try{await api('getAll');draw('x')}
  catch(e){
    if(e.auth)return lock(e.message);
    $('#ap').innerHTML=`<div class="card"><b class="out">Gagal memuat data</b><p class="mt">${esc(e.message)}. Pastikan URL API di index.html benar dan Web App di-deploy dengan akses Anyone.</p>
      <button class="sv" style="margin-top:8px" onclick="init()">Coba lagi</button></div>`;
  }
}
function lock(msg=''){
  Q=[];PIN='';pb='';try{sessionStorage.removeItem('pin')}catch(e){}
  S={...EMPTY};closeM();$('#ap').innerHTML='';$('#nv').hidden=true;$('#fab').classList.add('h');lockUI(msg);
}
function lockUI(msg='',bad=true){
  $('#lk').hidden=false;
  const keys=[1,2,3,4,5,6,7,8,9,'<',0,'ok'];
  $('#lk').innerHTML=`<div class="lkb"><div class="lg">💸💰</div><h1>Celengan</h1><p class="mt" style="margin:0">Masukkan PIN</p>
    <div class="dots ${msg&&bad?'sh':''}">${[...Array(Math.max(4,pb.length))].map((_,i)=>`<i class="${i<pb.length?'f':''} ${i==pb.length-1?'n':''}"></i>`).join('')}</div>
    <p class="${bad?'out':'mt'}" style="min-height:22px;margin:6px 0">${esc(msg)}</p>
    <div class="kp">${keys.map(k=>`<button class="${k=='ok'?'ok':''}" onclick="kp('${k}')" aria-label="${k=='<'?'Hapus':k=='ok'?'Masuk':k}">${k=='<'?'⌫':k=='ok'?'✓':k}</button>`).join('')}</div></div>`;
}
function kp(k){
  if(busy)return;
  if(k=='ok')return submitPin();
  if(k=='<')pb=pb.slice(0,-1);else if(pb.length<8)pb+=k;
  lockUI();
}
async function submitPin(){
  if(!pb||busy)return;
  busy=true;PIN=pb;lockUI('Memeriksa…',false);
  try{await api('login');try{sessionStorage.setItem('pin',PIN)}catch(e){}pb='';$('#lk').hidden=true;draw('x')}
  catch(e){PIN='';pb='';lockUI(e.auth?e.message:'Gagal terhubung: '+e.message)}
  busy=false;
}
addEventListener('keydown',e=>{
  if($('#lk').hidden)return;
  if(/^\d$/.test(e.key))kp(e.key);else if(e.key=='Backspace')kp('<');else if(e.key=='Enter')kp('ok');
});
document.addEventListener('visibilitychange',()=>{ // kunci otomatis setelah 3 menit di latar belakang
  if(document.hidden)hid=Date.now();else if(PIN&&hid&&Date.now()-hid>180000&&!Q.length&&!qb)lock();
});

/* ---------- komponen ---------- */
function chips(){
  const n=new Date(),a=[];
  for(let i=11;i>=0;i--)a.push(new Date(n.getFullYear(),n.getMonth()-i,1));
  return `<div class="chips">${a.map(d=>{const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
    return `<button class="chip ${k==ym?'on':''}" onclick="ym='${k}';draw()">${BL[d.getMonth()]} ${d.getFullYear()}</button>`}).join('')}</div>`;
}
const row=t=>{
  const k=S.cats.find(c=>c.id==t.kategori),tr=t.tipe=='transfer',m=t.tipe=='masuk';
  return `<div class="it" onclick="trxForm('${t.id}')">
    ${tr?'<div class="ic" style="background:#ffffff1f">🔁</div>':t.kategori=='adj'?'<div class="ic" style="background:#ffffff1f">⚖️</div>':ic(k||{nama:'?'})}
    <div class="g"><b>${tr?bm(t.bank)+' → '+bm(t.bank2):esc(k?k.nama:t.kategori=='adj'?'Penyesuaian saldo':'Tanpa kategori')}</b>
    <small>${t.jam?esc(t.jam)+' · ':''}${tr?'Transfer'+(t.biaya>0?' · admin '+rp(t.biaya):''):bm(t.bank)}${t.catatan?' · '+esc(t.catatan):''}</small></div>
    <b class="${m?'in':tr?'':'out'}">${m?'+':tr?'':'-'}${rp(t.jumlah)}</b></div>`;
};
const donut=(l,tipe,judul)=>{
  const m={};
  l.filter(t=>t.tipe==tipe&&t.kategori!='adj').forEach(t=>{const c=S.cats.find(c=>c.id==t.kategori)||{id:'?',nama:'Tanpa kategori'};
    (m[c.id]=m[c.id]||{c,v:0}).v+=Number(t.jumlah)});
  if(tipe=='keluar')l.filter(t=>t.tipe=='transfer'&&t.biaya>0).forEach(t=>{(m.fee=m.fee||{c:{id:'fee',nama:'Biaya admin'},v:0}).v+=Number(t.biaya)});
  const e=Object.values(m).sort((a,b)=>b.v-a.v),tot=e.reduce((a,x)=>a+x.v,0);let cu=0;
  const g=e.map(({c,v})=>{const s=cu;cu+=v/tot*100;return `${kcol(c.id)} ${s}% ${cu}%`}).join(',');
  return `<div class="card"><div class="rw"><b>${judul}</b><b>${rp(tot)}</b></div>
    ${tot?`<div class="pie" style="background:conic-gradient(${g})"></div>`:'<p class="mt" style="text-align:center;padding:24px 0">Tidak ada data bulan ini</p>'}
    ${e.map(({c,v})=>`<div class="it"><span class="dot" style="background:${kcol(c.id)}"></span><span class="g">${esc(c.nama)}</span><span>${Math.round(v/tot*100)}%</span><b>${rp(v)}</b></div>`).join('')}</div>`;
};

const shrink=f=>new Promise((ok,no)=>{
  const i=new Image();
  i.onload=()=>{const c=document.createElement('canvas');c.width=c.height=96;const x=c.getContext('2d'),s=Math.min(i.width,i.height);
    x.drawImage(i,(i.width-s)/2,(i.height-s)/2,s,s,0,0,96,96);
    let u=c.toDataURL('image/png');if(u.length>40000)u=c.toDataURL('image/jpeg',.7);
    URL.revokeObjectURL(i.src);ok(u)};
  i.onerror=()=>no(Error('Gambar tidak bisa dibaca'));
  i.src=URL.createObjectURL(f);
});

}

function trxList(){   // daftar transaksi; saat cari/filter aktif, mencari di semua bulan yang dimuat
  const act=Fq.q||Fq.k||Fq.b,q=Fq.q.toLowerCase(),
    l=(act?S.trx:mt()).filter(t=>(!Fq.k||t.kategori==Fq.k)&&(!Fq.b||t.bank==Fq.b||t.bank2==Fq.b)&&(!q||String(t.catatan||'').toLowerCase().includes(q)||((S.cats.find(c=>c.id==t.kategori)||{}).nama||'').toLowerCase().includes(q))),
    days=[...new Set(l.map(x=>x.tanggal))].sort().reverse(),
    o=act?{weekday:'short',day:'numeric',month:'short',year:'numeric'}:{weekday:'long',day:'numeric',month:'long'};
  return days.map(d=>`<div class="day">${new Date(d+'T00:00').toLocaleDateString('id-ID',o)}</div><div class="grp">${l.filter(x=>x.tanggal==d).sort((a,b)=>String(b.jam||'').localeCompare(String(a.jam||''))).map(row).join('')}</div>`).join('')+
    (l.length?'<p class="mt" style="font-size:12px;margin-top:16px">Ketuk transaksi untuk mengubah atau menghapus.'+(act?' Pencarian mencakup semua bulan yang dimuat.':'')+'</p>':
    act?'<div class="card empty"><b>Tidak ada hasil</b></div>':'<div class="card empty"><b>Belum ada transaksi</b><p class="mt">Tambahkan pemasukan atau pengeluaran pertama Anda. Hanya butuh hitungan detik.</p></div>');
}
function ringk(){   // banding bulan lalu, rata-rata harian, proyeksi
  const cur=ym==today().slice(0,7),d0=new Date(+ym.slice(0,4),+ym.slice(5)-2,1),pv=d0.getFullYear()+'-'+String(d0.getMonth()+1).padStart(2,'0'),
    e=sum(mt(),'keluar'),ep=sum(S.trx.filter(t=>String(t.tanggal).startsWith(pv)),'keluar'),
    dim=new Date(+ym.slice(0,4),+ym.slice(5),0).getDate(),dn=cur?new Date().getDate():dim,avg=e/dn,df=ep>0?Math.round((e-ep)/ep*100):null;
  return `<div class="card"><b>Pengeluaran ${BL[+ym.slice(5)-1]}</b><div class="pp" style="margin-top:10px">
    <div><small>Rata-rata/hari</small><b>${rp(avg)}</b></div><div><small>${cur?'Proyeksi akhir bulan':'Total bulan ini'}</small><b>${rp(cur?avg*dim:e)}</b></div></div>
    <p class="${df>0?'out':'in'}" style="margin:10px 0 0">${df===null?'Belum ada data bulan lalu.':(df>0?'▲ ':'▼ ')+Math.abs(df)+'% '+(df>0?'lebih boros':'lebih hemat')+' dari bulan lalu ('+rp(ep)+')'}</p></div>`;
}
function nbChart(now){   // grafik tren nilai bersih dari sheet Riwayat
  const p=S.riw.slice(-90).map(r=>Number(r.nilai));
  if(!p.length||p[p.length-1]!==now)p.push(now);
  if(p.length<2)return '<div class="card"><b>Tren nilai bersih</b><p class="mt">Grafik muncul setelah ada data beberapa hari. Nilai bersih dicatat otomatis setiap hari.</p></div>';
  const lo=Math.min(...p),hi=Math.max(...p),r=(hi-lo)||1,d=now-p[0],
    pts=p.map((v,i)=>(i/(p.length-1)*300).toFixed(1)+','+(86-(v-lo)/r*80).toFixed(1)).join(' ');
  return `<div class="card"><div class="rw"><b>Tren nilai bersih</b><small class="${d<0?'out':'in'}">${d<0?'▼ ':'▲ '}${rp(Math.abs(d))}</small></div>
    <svg viewBox="0 0 300 90" preserveAspectRatio="none" style="width:100%;height:110px;margin-top:8px"><polyline points="${pts}" fill="none" stroke="var(--g)" stroke-width="3" vector-effect="non-scaling-stroke"/></svg>
    <div class="rw"><small class="mt">${rp(lo)}</small><small class="mt">${p.length} catatan terakhir</small><small class="mt">${rp(hi)}</small></div></div>`;
}
const tempoU=u=>{if(!u.tempo||!(u.sisa>0))return'';const d=Math.ceil((new Date(u.tempo+'T00:00')-new Date())/864e5);
  return `<small class="${d<0?'out':d<=7?'warn':'mt'}" style="display:block">${d<0?'⚠ Lewat tempo '+(-d)+' hari':'Jatuh tempo '+u.tempo.split('-').reverse().join('/')+' ('+(d<=0?'hari ini':d+' hari lagi')+')'}</small>`};
const srcOpts=v=>`<optgroup label="Dompet">${S.banks.map(b=>`<option value="${b.id}" ${b.id==v?'selected':''}>${esc(b.nama)}</option>`).join('')}</optgroup>`+(S.aset.length?`<optgroup label="Aset / investasi">${S.aset.map(a=>`<option value="a:${a.id}" ${('a:'+a.id)==v?'selected':''}>${esc(a.nama)}</option>`).join('')}</optgroup>`:'');
function targetForm(id){
  if(!S.banks.length)return alert('Tambah dompet dulu di Akun, Pengaturan, Dompet.');
  const t=S.target.find(x=>x.id==id)||{nama:'',jumlah:'',sumber:S.banks[0].id,tenggat:''};
  modal(id?'Edit target':'Tambah target',`<div class="fr"><span>Nama</span><input id="tn" placeholder="Laptop, Liburan" value="${esc(t.nama)}"></div>
    <div class="fr"><span>Target (Rp)</span><input id="tj" type="number" inputmode="decimal" value="${t.jumlah}"></div>
    <div class="fr"><span>Disimpan di</span><select id="tsrc">${srcOpts(t.sumber)}</select></div>
    <div class="fr"><span>Tenggat</span><input id="td" type="date" value="${esc(t.tenggat)}"></div>
    <p class="mt" style="font-size:12px">Progress mengikuti saldo dompet atau nilai aset yang dipilih.</p>
    <button class="sv" onclick="saveTarget('${id||''}',this)">Simpan</button>${id?del('delTarget',id,'Hapus target ini?'):''}`);
}
function saveTarget(id,btn){
  const d={id,nama:$('#tn').value.trim(),jumlah:Number($('#tj').value),sumber:$('#tsrc').value,tenggat:$('#td').value};
  if(!d.nama||!(d.jumlah>0))return alert('Isi nama dan target lebih dari 0');
  run('saveTarget',d,btn);
}

let tx=0,ty=0;
addEventListener('touchstart',e=>{const t=e.touches[0];tx=t.clientX;ty=t.clientY},{passive:true});
addEventListener('touchend',e=>{const t=e.changedTouches[0];
  if(tab=='akun'&&sub=='set'&&pg&&!$('#md').classList.contains('o')&&tx<40&&t.clientX-tx>80&&Math.abs(t.clientY-ty)<60)back()},{passive:true});
const FA={target:()=>targetForm(),dompet:()=>bankForm(),aset:()=>asetForm(),utang:()=>utangForm(),kat:()=>katForm('','keluar'),rutin:()=>rutinForm()};
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
init();
</script>
</body>
</html>
